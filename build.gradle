buildscript {
    repositories {
        mavenCentral()
        maven { name = 'forge'; url = 'https://maven.minecraftforge.net' }
    }
    dependencies {
        // Maintained legacy ForgeGradle 2.3 fork, compatible with Minecraft 1.12.2.
        classpath 'com.anatawa12.forge:ForgeGradle:2.3-1.0.1'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = project.mod_version
group = project.mod_group
archivesBaseName = project.mod_name
sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    // ForgeGradle 2.3 requires the legacy userdev.jar package.
    // Forge 2859 currently serves userdev3; 2847 still provides userdev.jar.
    version = '1.12.2-14.23.5.2847'
    runDir = 'run'
    mappings = 'stable_39'
}

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes 'Implementation-Title': 'IsoCraft Camera',
                   'Implementation-Version': project.version
    }
}
